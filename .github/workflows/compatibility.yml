#
# Manual compatibility proof on one disposable self-hosted Linux runner.
#
# The runner's own .env supplies the NODE_OPTIONS preload that points node
# actions at the local request observer on 127.0.0.1:8123; the cache server
# listens behind it on 127.0.0.1:8095. Both are experiment processes of this
# workflow. Nothing here provisions, registers, releases or deploys anything.
#
# The experiment root uses the optional CUBBY_PROOF_ROOT repository variable,
# otherwise $RUNNER_TOOL_CACHE/cubby-compatibility. It must stay outside the
# checkout and outside the runner temp directory, and it is the host directory
# the container job mounts read-only. Each workflow run has its own cache.

name: compatibility

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Label of the disposable self-hosted Linux runner
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: false

env:
  CUBBY_BACKEND_PORT: '8095'
  CUBBY_FRONT_PORT: '8123'
  CUBBY_SENTINEL_PORT: '18095'
  CUBBY_CAP_BYTES: '4294967296'
  CUBBY_SMALL_BYTES: '1048576'
  CUBBY_LARGE_BYTES: '201326592'

jobs:
  cache-save:
    name: Cache save (v4, v5, v6)
    runs-on: [self-hosted, Linux, X64, "${{ inputs.runner_label }}"]
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Resolve the experiment roots
        env:
          CONFIGURED_ROOT: ${{ vars.CUBBY_PROOF_ROOT }}
        run: |
          set -euo pipefail
          root="${CONFIGURED_ROOT:-}"
          if [ -n "$root" ]; then
            case "$root" in
              */) echo "::error::the CUBBY_PROOF_ROOT variable must not end with a slash"; exit 1 ;;
            esac
          fi
          if [ -z "$root" ]; then
            if [ -z "${RUNNER_TOOL_CACHE:-}" ]; then
              echo "::error::set the CUBBY_PROOF_ROOT variable or run on a runner with a tool cache"
              exit 1
            fi
            root="$RUNNER_TOOL_CACHE/cubby-compatibility"
          fi
          case "$root" in
            /*) ;;
            *) echo "::error::the experiment root must be an absolute path"; exit 1 ;;
          esac
          case "$root/" in
            "$GITHUB_WORKSPACE"/*) echo "::error::the experiment root must stay outside the checkout"; exit 1 ;;
          esac
          if [ -n "${RUNNER_TEMP:-}" ]; then
            case "$root/" in
              "$RUNNER_TEMP"/*) echo "::error::the experiment root must stay outside the runner temp directory"; exit 1 ;;
            esac
          fi
          exp="$root/runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "$exp" in
            "$root"/*) ;;
            *) echo "::error::the experiment directory must stay inside the experiment root"; exit 1 ;;
          esac
          mkdir -p "$exp/bin" "$exp/cache"
          {
            echo "PROOF_ROOT=$root"
            echo "CACHE_DIR=$exp/cache"
            echo "EXP_DIR=$exp"
            echo "CUBBY_BIN=$exp/bin/cubby"
            echo "KEY_PREFIX=cubby-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_ENV"
          echo "experiment root resolved"

      - name: Build the cache server
        run: |
          set -euo pipefail
          go build -o "$CUBBY_BIN" ./cmd/cubby
          go version
          node --version
          echo "runner ${RUNNER_OS:-unknown}/${RUNNER_ARCH:-unknown}"

      - name: Start the cache server
        uses: ./compatibility/actions/cubby-server
        env:
          NODE_OPTIONS: ''
        with:
          mode: start
          binary: ${{ env.CUBBY_BIN }}
          storage_dir: ${{ env.CACHE_DIR }}
          port: ${{ env.CUBBY_BACKEND_PORT }}
          cap_bytes: ${{ env.CUBBY_CAP_BYTES }}

      - name: Start the request observer
        run: |
          set -euo pipefail
          log="$EXP_DIR/observer-save.jsonl"
          : > "$log"
          CUBBY_PORT="$CUBBY_BACKEND_PORT" PROXY_PORT="$CUBBY_FRONT_PORT" PROXY_LOG="$log" \
            RUNNER_TRACKING_ID='' NODE_OPTIONS='' nohup node compatibility/client-proof/proxy.mjs \
            >"$RUNNER_TEMP/observer-save.out" 2>&1 &
          echo $! > "$RUNNER_TEMP/observer-save.pid"
          for _ in $(seq 1 50); do
            if node -e 'const net=require("node:net");const s=net.connect(Number(process.argv[1]),"127.0.0.1");s.on("connect",()=>{s.destroy();process.exit(0)});s.on("error",()=>process.exit(1))' "$CUBBY_FRONT_PORT"; then
              exit 0
            fi
            sleep 0.2
          done
          echo "::error::the request observer did not accept a connection"
          cat "$RUNNER_TEMP/observer-save.out"
          exit 1

      - name: Classify the endpoint this job inherits
        id: preload-endpoint
        uses: ./compatibility/actions/cache-endpoint
        with:
          port: ${{ env.CUBBY_FRONT_PORT }}

      - name: Assert the runner preload reached this job
        env:
          ENDPOINT: ${{ steps.preload-endpoint.outputs.endpoint }}
        run: |
          set -euo pipefail
          if [ "$ENDPOINT" != 'cubby-loopback' ]; then
            echo "::error::the runner's NODE_OPTIONS preload must point node actions at the observer"
            exit 1
          fi

      - name: Create the fixtures
        run: |
          set -euo pipefail
          node compatibility/fixtures/cache-fixture.cjs create --dir fixture/small --bytes "$CUBBY_SMALL_BYTES" --expect "$EXP_DIR/expected-small.json" --file payload.bin
          node compatibility/fixtures/cache-fixture.cjs create --dir fixture/large --bytes "$CUBBY_LARGE_BYTES" --expect "$EXP_DIR/expected-large.json" --file payload.bin

      - name: Note the observer position before the 4.2.4 saves
        run: echo "OFFSET_V4=$(wc -l < "$EXP_DIR/observer-save.jsonl")" >> "$GITHUB_ENV"

      - name: Save the small fixture with actions/cache 4.2.4
        uses: ./compatibility/cache-case
        with:
          mode: save
          version: '4'
          key: ${{ env.KEY_PREFIX }}-v4-small
          path: fixture/small

      - name: Save the large fixture with actions/cache 4.2.4
        uses: ./compatibility/cache-case
        with:
          mode: save
          version: '4'
          key: ${{ env.KEY_PREFIX }}-v4-large
          path: fixture/large

      - name: Assert the 4.2.4 uploads
        run: |
          set -euo pipefail
          node compatibility/assert-case.mjs observer-save \
            --log "$EXP_DIR/observer-save.jsonl" \
            --from "$OFFSET_V4" \
            --whole \
            --blocks \
            --min-bytes "$CUBBY_SMALL_BYTES" \
            --min-block-bytes 167772160

      - name: Note the observer position before the 5.1.0 saves
        run: echo "OFFSET_V5=$(wc -l < "$EXP_DIR/observer-save.jsonl")" >> "$GITHUB_ENV"

      - name: Save the small fixture with actions/cache 5.1.0
        uses: ./compatibility/cache-case
        with:
          mode: save
          version: '5'
          key: ${{ env.KEY_PREFIX }}-v5-small
          path: fixture/small

      - name: Save the large fixture with actions/cache 5.1.0
        uses: ./compatibility/cache-case
        with:
          mode: save
          version: '5'
          key: ${{ env.KEY_PREFIX }}-v5-large
          path: fixture/large

      - name: Assert the 5.1.0 uploads
        run: |
          set -euo pipefail
          node compatibility/assert-case.mjs observer-save \
            --log "$EXP_DIR/observer-save.jsonl" \
            --from "$OFFSET_V5" \
            --whole \
            --blocks \
            --min-bytes "$CUBBY_SMALL_BYTES" \
            --min-block-bytes 167772160

      - name: Note the observer position before the 6.1.0 saves
        run: echo "OFFSET_V6=$(wc -l < "$EXP_DIR/observer-save.jsonl")" >> "$GITHUB_ENV"

      - name: Save the small fixture with actions/cache 6.1.0
        uses: ./compatibility/cache-case
        with:
          mode: save
          version: '6'
          key: ${{ env.KEY_PREFIX }}-v6-small
          path: fixture/small

      - name: Save the large fixture with actions/cache 6.1.0
        uses: ./compatibility/cache-case
        with:
          mode: save
          version: '6'
          key: ${{ env.KEY_PREFIX }}-v6-large
          path: fixture/large

      - name: Assert the 6.1.0 uploads
        run: |
          set -euo pipefail
          node compatibility/assert-case.mjs observer-save \
            --log "$EXP_DIR/observer-save.jsonl" \
            --from "$OFFSET_V6" \
            --whole \
            --blocks \
            --min-bytes "$CUBBY_SMALL_BYTES" \
            --min-block-bytes 167772160

      - name: Classify the endpoint with the preload cleared
        id: override-endpoint
        uses: ./compatibility/actions/cache-endpoint
        env:
          NODE_OPTIONS: ''
        with:
          port: ${{ env.CUBBY_FRONT_PORT }}

      - name: Assert the cleared step sees the original endpoint
        env:
          ENDPOINT: ${{ steps.override-endpoint.outputs.endpoint }}
        run: |
          set -euo pipefail
          if [ "$ENDPOINT" != 'original-https' ]; then
            echo "::error::clearing NODE_OPTIONS must expose the original endpoint"
            exit 1
          fi

      - name: Create the override fixture
        run: |
          set -euo pipefail
          rm -rf fixture/override
          node compatibility/fixtures/cache-fixture.cjs create --dir fixture/override --bytes "$CUBBY_SMALL_BYTES" --expect "$EXP_DIR/expected-override.json" --file payload.bin

      - name: Note the observer position before the override save
        run: echo "OVERRIDE_OFFSET=$(wc -l < "$EXP_DIR/observer-save.jsonl")" >> "$GITHUB_ENV"

      - name: Save through the original endpoint
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          NODE_OPTIONS: ''
        with:
          key: ${{ env.KEY_PREFIX }}-override-small
          path: fixture/override

      - name: Assert the override save never reached the observer
        run: |
          set -euo pipefail
          node compatibility/assert-case.mjs observer-count \
            --log "$EXP_DIR/observer-save.jsonl" \
            --from "$OVERRIDE_OFFSET" \
            --contains CacheService \
            --max 0

      - name: Stop the cache server
        if: always()
        uses: ./compatibility/actions/cubby-server
        with:
          mode: cleanup
          port: ${{ env.CUBBY_BACKEND_PORT }}

      - name: Stop the request observer
        if: always()
        run: |
          set -euo pipefail
          pid_file="$RUNNER_TEMP/observer-save.pid"
          if [ -f "$pid_file" ]; then
            pid=$(cat "$pid_file")
            if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null \
              && tr '\0' ' ' < "/proc/$pid/cmdline" | grep -q 'compatibility/client-proof/proxy.mjs'; then
              kill "$pid" 2>/dev/null || true
            fi
            rm -f "$pid_file"
          fi

  cache-restore:
    name: Cache restore (v4, v5, v6)
    needs: cache-save
    runs-on: [self-hosted, Linux, X64, "${{ inputs.runner_label }}"]
    timeout-minutes: 20
    outputs:
      sentinel_dir: ${{ steps.sentinel.outputs.dir }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Resolve the experiment roots
        env:
          CONFIGURED_ROOT: ${{ vars.CUBBY_PROOF_ROOT }}
        run: |
          set -euo pipefail
          root="${CONFIGURED_ROOT:-}"
          if [ -n "$root" ]; then
            case "$root" in
              */) echo "::error::the CUBBY_PROOF_ROOT variable must not end with a slash"; exit 1 ;;
            esac
          fi
          if [ -z "$root" ]; then
            if [ -z "${RUNNER_TOOL_CACHE:-}" ]; then
              echo "::error::set the CUBBY_PROOF_ROOT variable or run on a runner with a tool cache"
              exit 1
            fi
            root="$RUNNER_TOOL_CACHE/cubby-compatibility"
          fi
          case "$root" in
            /*) ;;
            *) echo "::error::the experiment root must be an absolute path"; exit 1 ;;
          esac
          case "$root/" in
            "$GITHUB_WORKSPACE"/*) echo "::error::the experiment root must stay outside the checkout"; exit 1 ;;
          esac
          if [ -n "${RUNNER_TEMP:-}" ]; then
            case "$root/" in
              "$RUNNER_TEMP"/*) echo "::error::the experiment root must stay outside the runner temp directory"; exit 1 ;;
            esac
          fi
          exp="$root/runs/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          case "$exp" in
            "$root"/*) ;;
            *) echo "::error::the experiment directory must stay inside the experiment root"; exit 1 ;;
          esac
          mkdir -p "$exp/bin" "$exp/cache"
          {
            echo "PROOF_ROOT=$root"
            echo "CACHE_DIR=$exp/cache"
            echo "EXP_DIR=$exp"
            echo "CUBBY_BIN=$exp/bin/cubby"
            echo "KEY_PREFIX=cubby-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_ENV"
          echo "experiment root resolved"

      - name: Build the cache server
        run: |
          set -euo pipefail
          go build -o "$CUBBY_BIN" ./cmd/cubby
          go version
          node --version
          echo "runner ${RUNNER_OS:-unknown}/${RUNNER_ARCH:-unknown}"

      - name: Start the cache server
        uses: ./compatibility/actions/cubby-server
        env:
          NODE_OPTIONS: ''
        with:
          mode: start
          binary: ${{ env.CUBBY_BIN }}
          storage_dir: ${{ env.CACHE_DIR }}
          port: ${{ env.CUBBY_BACKEND_PORT }}
          cap_bytes: ${{ env.CUBBY_CAP_BYTES }}

      - name: Start the request observer
        run: |
          set -euo pipefail
          log="$EXP_DIR/observer-restore.jsonl"
          : > "$log"
          CUBBY_PORT="$CUBBY_BACKEND_PORT" PROXY_PORT="$CUBBY_FRONT_PORT" PROXY_LOG="$log" \
            RUNNER_TRACKING_ID='' NODE_OPTIONS='' nohup node compatibility/client-proof/proxy.mjs \
            >"$RUNNER_TEMP/observer-restore.out" 2>&1 &
          echo $! > "$RUNNER_TEMP/observer-restore.pid"
          for _ in $(seq 1 50); do
            if node -e 'const net=require("node:net");const s=net.connect(Number(process.argv[1]),"127.0.0.1");s.on("connect",()=>{s.destroy();process.exit(0)});s.on("error",()=>process.exit(1))' "$CUBBY_FRONT_PORT"; then
              exit 0
            fi
            sleep 0.2
          done
          echo "::error::the request observer did not accept a connection"
          cat "$RUNNER_TEMP/observer-restore.out"
          exit 1

      - name: Classify the endpoint this job inherits
        id: preload-endpoint
        uses: ./compatibility/actions/cache-endpoint
        with:
          port: ${{ env.CUBBY_FRONT_PORT }}

      - name: Assert the runner preload reached this job
        env:
          ENDPOINT: ${{ steps.preload-endpoint.outputs.endpoint }}
        run: |
          set -euo pipefail
          if [ "$ENDPOINT" != 'cubby-loopback' ]; then
            echo "::error::the runner's NODE_OPTIONS preload must point node actions at the observer"
            exit 1
          fi

      - name: Restore the 4.2.4 small fixture by exact key
        uses: ./compatibility/cache-case
        with:
          mode: restore
          version: '4'
          key: ${{ env.KEY_PREFIX }}-v4-small
          path: fixture/small
          remove-before: 'true'
          expect-hit: 'true'
          expect-key: ${{ env.KEY_PREFIX }}-v4-small
          expect-digest: ${{ env.EXP_DIR }}/expected-small.json

      - name: Restore the 4.2.4 small fixture by a restore key
        uses: ./compatibility/cache-case
        with:
          mode: restore
          version: '4'
          key: ${{ env.KEY_PREFIX }}-v4-small-absent
          restore-keys: ${{ env.KEY_PREFIX }}-v4-small
          path: fixture/small
          remove-before: 'true'
          expect-hit: 'false'
          expect-key: ${{ env.KEY_PREFIX }}-v4-small
          expect-digest: ${{ env.EXP_DIR }}/expected-small.json

      - name: Restore the 4.2.4 large fixture by exact key
        uses: ./compatibility/cache-case
        with:
          mode: restore
          version: '4'
          key: ${{ env.KEY_PREFIX }}-v4-large
          path: fixture/large
          remove-before: 'true'
          expect-hit: 'true'
          expect-key: ${{ env.KEY_PREFIX }}-v4-large
          expect-digest: ${{ env.EXP_DIR }}/expected-large.json

      - name: Restore the 4.2.4 large fixture by a restore key
        uses: ./compatibility/cache-case
        with:
          mode: restore
          version: '4'
          key: ${{ env.KEY_PREFIX }}-v4-large-absent
          restore-keys: ${{ env.KEY_PREFIX }}-v4-large
          path: fixture/large
          remove-before: 'true'
          expect-hit: 'false'
          expect-key: ${{ env.KEY_PREFIX }}-v4-large
          expect-digest: ${{ env.EXP_DIR }}/expected-large.json

      - name: Restore the 5.1.0 small fixture by exact key
        uses: ./compatibility/cache-case
        with:
          mode: restore
          version: '5'
          key: ${{ env.KEY_PREFIX }}-v5-small
          path: fixture/small
          remove-before: 'true'
          expect-hit: 'true'
          expect-key: ${{ env.KEY_PREFIX }}-v5-small
          expect-digest: ${{ env.EXP_DIR }}/expected-small.json

      - name: Restore the 5.1.0 small fixture by a restore key
        uses: ./compatibility/cache-case
        with:
          mode: restore
          version: '5'
          key: ${{ env.KEY_PREFIX }}-v5-small-absent
          restore-keys: ${{ env.KEY_PREFIX }}-v5-small
          path: fixture/small
          remove-before: 'true'
          expect-hit: 'false'
          expect-key: ${{ env.KEY_PREFIX }}-v5-small
          expect-digest: ${{ env.EXP_DIR }}/expected-small.json

      - name: Restore the 5.1.0 large fixture by exact key
        uses: ./compatibility/cache-case
        with:
          mode: restore
          version: '5'
          key: ${{ env.KEY_PREFIX }}-v5-large
          path: fixture/large
          remove-before: 'true'
          expect-hit: 'true'
          expect-key: ${{ env.KEY_PREFIX }}-v5-large
          expect-digest: ${{ env.EXP_DIR }}/expected-large.json

      - name: Restore the 5.1.0 large fixture by a restore key
        uses: ./compatibility/cache-case
        with:
          mode: restore
          version: '5'
          key: ${{ env.KEY_PREFIX }}-v5-large-absent
          restore-keys: ${{ env.KEY_PREFIX }}-v5-large
          path: fixture/large
          remove-before: 'true'
          expect-hit: 'false'
          expect-key: ${{ env.KEY_PREFIX }}-v5-large
          expect-digest: ${{ env.EXP_DIR }}/expected-large.json

      - name: Restore the 6.1.0 small fixture by exact key
        uses: ./compatibility/cache-case
        with:
          mode: restore
          version: '6'
          key: ${{ env.KEY_PREFIX }}-v6-small
          path: fixture/small
          remove-before: 'true'
          expect-hit: 'true'
          expect-key: ${{ env.KEY_PREFIX }}-v6-small
          expect-digest: ${{ env.EXP_DIR }}/expected-small.json

      - name: Restore the 6.1.0 small fixture by a restore key
        uses: ./compatibility/cache-case
        with:
          mode: restore
          version: '6'
          key: ${{ env.KEY_PREFIX }}-v6-small-absent
          restore-keys: ${{ env.KEY_PREFIX }}-v6-small
          path: fixture/small
          remove-before: 'true'
          expect-hit: 'false'
          expect-key: ${{ env.KEY_PREFIX }}-v6-small
          expect-digest: ${{ env.EXP_DIR }}/expected-small.json

      - name: Restore the 6.1.0 large fixture by exact key
        uses: ./compatibility/cache-case
        with:
          mode: restore
          version: '6'
          key: ${{ env.KEY_PREFIX }}-v6-large
          path: fixture/large
          remove-before: 'true'
          expect-hit: 'true'
          expect-key: ${{ env.KEY_PREFIX }}-v6-large
          expect-digest: ${{ env.EXP_DIR }}/expected-large.json

      - name: Restore the 6.1.0 large fixture by a restore key
        uses: ./compatibility/cache-case
        with:
          mode: restore
          version: '6'
          key: ${{ env.KEY_PREFIX }}-v6-large-absent
          restore-keys: ${{ env.KEY_PREFIX }}-v6-large
          path: fixture/large
          remove-before: 'true'
          expect-hit: 'false'
          expect-key: ${{ env.KEY_PREFIX }}-v6-large
          expect-digest: ${{ env.EXP_DIR }}/expected-large.json

      - name: Classify the endpoint with the preload cleared
        id: override-endpoint
        uses: ./compatibility/actions/cache-endpoint
        env:
          NODE_OPTIONS: ''
        with:
          port: ${{ env.CUBBY_FRONT_PORT }}

      - name: Assert the cleared step sees the original endpoint
        env:
          ENDPOINT: ${{ steps.override-endpoint.outputs.endpoint }}
        run: |
          set -euo pipefail
          if [ "$ENDPOINT" != 'original-https' ]; then
            echo "::error::clearing NODE_OPTIONS must expose the original endpoint"
            exit 1
          fi

      - name: Note the observer position before the override restore
        run: echo "OVERRIDE_OFFSET=$(wc -l < "$EXP_DIR/observer-restore.jsonl")" >> "$GITHUB_ENV"

      - name: Restore through the original endpoint
        id: override-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          NODE_OPTIONS: ''
        with:
          key: ${{ env.KEY_PREFIX }}-override-small
          path: fixture/override

      - name: Assert the override restore
        env:
          ACTUAL_HIT: ${{ steps.override-restore.outputs.cache-hit }}
          ACTUAL_KEY: ${{ steps.override-restore.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          node compatibility/assert-case.mjs restore true \
            "$ACTUAL_HIT" "$ACTUAL_KEY" "$KEY_PREFIX-override-small" \
            fixture/override "$EXP_DIR/expected-override.json"
          rm -rf fixture/override

      - name: Assert the override restore never reached the observer
        run: |
          set -euo pipefail
          node compatibility/assert-case.mjs observer-count \
            --log "$EXP_DIR/observer-restore.jsonl" \
            --from "$OVERRIDE_OFFSET" \
            --contains CacheService \
            --max 0

      - name: Create the artifact fixture
        run: |
          set -euo pipefail
          rm -rf artifact-src artifact-out
          node compatibility/fixtures/cache-fixture.cjs create --dir artifact-src --bytes 65536 --expect "$EXP_DIR/expected-artifact.json" --file payload.bin

      - name: Note the observer position before the artifact roundtrip
        run: echo "ARTIFACT_OFFSET=$(wc -l < "$EXP_DIR/observer-restore.jsonl")" >> "$GITHUB_ENV"

      - name: Upload the artifact through the preload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-payload
          path: artifact-src/payload.bin
          if-no-files-found: error

      - name: Remove the artifact source
        run: rm -rf artifact-src

      - name: Download the artifact through the preload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compatibility-payload
          path: artifact-out

      - name: Verify the downloaded bytes
        run: |
          set -euo pipefail
          node compatibility/fixtures/cache-fixture.cjs verify --dir artifact-out --expect "$EXP_DIR/expected-artifact.json"

      - name: Assert the artifact service was forwarded
        run: |
          set -euo pipefail
          node compatibility/assert-case.mjs observer-count \
            --log "$EXP_DIR/observer-restore.jsonl" \
            --from "$ARTIFACT_OFFSET" \
            --contains ArtifactService \
            --status-class 2 \
            --min 2

      - name: Start the bounded host sentinel
        id: sentinel
        run: |
          set -euo pipefail
          state="$EXP_DIR/container-heartbeat.json"
          rm -f "$state"
          RUNNER_TRACKING_ID='' NODE_OPTIONS='' nohup node compatibility/container-probe.mjs host \
            --state "$state" --port "$CUBBY_SENTINEL_PORT" --lifetime 900 \
            >"$RUNNER_TEMP/host-sentinel.out" 2>&1 &
          echo $! > "$RUNNER_TEMP/host-sentinel.pid"
          ready=""
          for _ in $(seq 1 100); do
            if [ -f "$state" ]; then
              ready=1
              break
            fi
            sleep 0.2
          done
          if [ -z "$ready" ]; then
            echo "::error::the host sentinel did not write a heartbeat"
            cat "$RUNNER_TEMP/host-sentinel.out"
            exit 1
          fi
          echo "dir=$EXP_DIR" >> "$GITHUB_OUTPUT"

      # The sentinel is bounded and deliberately not killed here: the container
      # job needs it alive, and it stops itself after its own lifetime.
      - name: Stop the cache server
        if: always()
        uses: ./compatibility/actions/cubby-server
        with:
          mode: cleanup
          port: ${{ env.CUBBY_BACKEND_PORT }}

      - name: Stop the request observer
        if: always()
        run: |
          set -euo pipefail
          pid_file="$RUNNER_TEMP/observer-restore.pid"
          if [ -f "$pid_file" ]; then
            pid=$(cat "$pid_file")
            if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null \
              && tr '\0' ' ' < "/proc/$pid/cmdline" | grep -q 'compatibility/client-proof/proxy.mjs'; then
              kill "$pid" 2>/dev/null || true
            fi
            rm -f "$pid_file"
          fi

  container-boundary:
    # Records one negative boundary fact. It is not a container support claim,
    # and it starts nothing reachable from outside the container.
    name: Container boundary (negative)
    needs: cache-restore
    runs-on: [self-hosted, Linux, X64, "${{ inputs.runner_label }}"]
    timeout-minutes: 20
    container:
      image: node:24-bookworm
      volumes:
        - "${{ needs.cache-restore.outputs.sentinel_dir }}:/cubby-proof:ro"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          NODE_OPTIONS: ''
        with:
          persist-credentials: false

      - name: Classify the endpoint the container inherits
        id: container-endpoint
        uses: ./compatibility/actions/cache-endpoint
        with:
          port: ${{ env.CUBBY_FRONT_PORT }}

      - name: Record the inherited classification
        env:
          ENDPOINT: ${{ steps.container-endpoint.outputs.endpoint }}
        run: echo "container endpoint is $ENDPOINT"

      - name: Require a fresh host heartbeat and a refused container connection
        run: |
          set -euo pipefail
          node compatibility/container-probe.mjs probe \
            --state /cubby-proof/container-heartbeat.json \
            --port "$CUBBY_SENTINEL_PORT"
