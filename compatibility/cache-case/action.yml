#
# One cache case: save or restore one path with a pinned actions/cache release,
# and optionally remove the path first and check the result against the digest
# recorded before the save. The workflow keeps the case list, keys and expected
# outcomes; this action only removes the repeated step bodies.
#
# Every restore step carries the same `path` string the save used, because the
# cache version hashes the input path strings.
name: Cache case
description: Save or restore one path with a pinned actions/cache release, with an optional result check.

inputs:
  mode:
    description: save or restore.
    required: true
  version:
    description: Cache action release series, 4, 5 or 6.
    required: true
  key:
    description: Cache key.
    required: true
  path:
    description: Path to cache, relative to the workspace.
    required: true
  restore-keys:
    description: Additional restore keys, one per line.
    required: false
    default: ''
  remove-before:
    description: Remove the path before a restore, when the case deletes the data first.
    required: false
    default: 'false'
  expect-hit:
    description: Expected cache-hit for a restore; empty runs no check.
    required: false
    default: ''
  expect-key:
    description: Expected matched key for a restore.
    required: false
    default: ''
  expect-digest:
    description: Expected-digest JSON written by the fixture helper.
    required: false
    default: ''

outputs:
  cache-hit:
    description: cache-hit of the restore step the version selected.
    value: ${{ steps.restore-v4.outputs.cache-hit || steps.restore-v5.outputs.cache-hit || steps.restore-v6.outputs.cache-hit }}
  matched-key:
    description: cache-matched-key of the restore step the version selected.
    value: ${{ steps.restore-v4.outputs.cache-matched-key || steps.restore-v5.outputs.cache-matched-key || steps.restore-v6.outputs.cache-matched-key }}

runs:
  using: composite
  steps:
    - name: Remove the path before the restore
      if: inputs.mode == 'restore' && inputs.remove-before == 'true'
      shell: bash
      env:
        FIXTURE_DIR: ${{ inputs.path }}
      run: |
        set -euo pipefail
        case "$FIXTURE_DIR" in
          ''|.|/*|..|../*|*/../*|*/..) echo "::error::the cache path must stay inside the workspace"; exit 1 ;;
        esac
        rm -rf -- "$FIXTURE_DIR"

    - name: Save with actions/cache 4.2.4
      if: inputs.mode == 'save' && inputs.version == '4'
      uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        key: ${{ inputs.key }}
        path: ${{ inputs.path }}

    - name: Save with actions/cache 5.1.0
      if: inputs.mode == 'save' && inputs.version == '5'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        key: ${{ inputs.key }}
        path: ${{ inputs.path }}

    - name: Save with actions/cache 6.1.0
      if: inputs.mode == 'save' && inputs.version == '6'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ inputs.key }}
        path: ${{ inputs.path }}

    - name: Restore with actions/cache 4.2.4
      id: restore-v4
      if: inputs.mode == 'restore' && inputs.version == '4'
      uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        key: ${{ inputs.key }}
        path: ${{ inputs.path }}
        restore-keys: ${{ inputs.restore-keys }}

    - name: Restore with actions/cache 5.1.0
      id: restore-v5
      if: inputs.mode == 'restore' && inputs.version == '5'
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        key: ${{ inputs.key }}
        path: ${{ inputs.path }}
        restore-keys: ${{ inputs.restore-keys }}

    - name: Restore with actions/cache 6.1.0
      id: restore-v6
      if: inputs.mode == 'restore' && inputs.version == '6'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ inputs.key }}
        path: ${{ inputs.path }}
        restore-keys: ${{ inputs.restore-keys }}

    - name: Check the 4.2.4 restore
      if: inputs.mode == 'restore' && inputs.version == '4' && inputs.expect-hit != ''
      shell: bash
      env:
        EXPECTED_HIT: ${{ inputs.expect-hit }}
        EXPECTED_KEY: ${{ inputs.expect-key }}
        ACTUAL_HIT: ${{ steps.restore-v4.outputs.cache-hit }}
        ACTUAL_KEY: ${{ steps.restore-v4.outputs.cache-matched-key }}
        FIXTURE_DIR: ${{ inputs.path }}
        EXPECT_DIGEST: ${{ inputs.expect-digest }}
      run: |
        node "$GITHUB_ACTION_PATH/../assert-case.mjs" restore \
          "$EXPECTED_HIT" "$ACTUAL_HIT" "$ACTUAL_KEY" "$EXPECTED_KEY" "$FIXTURE_DIR" "$EXPECT_DIGEST"

    - name: Check the 5.1.0 restore
      if: inputs.mode == 'restore' && inputs.version == '5' && inputs.expect-hit != ''
      shell: bash
      env:
        EXPECTED_HIT: ${{ inputs.expect-hit }}
        EXPECTED_KEY: ${{ inputs.expect-key }}
        ACTUAL_HIT: ${{ steps.restore-v5.outputs.cache-hit }}
        ACTUAL_KEY: ${{ steps.restore-v5.outputs.cache-matched-key }}
        FIXTURE_DIR: ${{ inputs.path }}
        EXPECT_DIGEST: ${{ inputs.expect-digest }}
      run: |
        node "$GITHUB_ACTION_PATH/../assert-case.mjs" restore \
          "$EXPECTED_HIT" "$ACTUAL_HIT" "$ACTUAL_KEY" "$EXPECTED_KEY" "$FIXTURE_DIR" "$EXPECT_DIGEST"

    - name: Check the 6.1.0 restore
      if: inputs.mode == 'restore' && inputs.version == '6' && inputs.expect-hit != ''
      shell: bash
      env:
        EXPECTED_HIT: ${{ inputs.expect-hit }}
        EXPECTED_KEY: ${{ inputs.expect-key }}
        ACTUAL_HIT: ${{ steps.restore-v6.outputs.cache-hit }}
        ACTUAL_KEY: ${{ steps.restore-v6.outputs.cache-matched-key }}
        FIXTURE_DIR: ${{ inputs.path }}
        EXPECT_DIGEST: ${{ inputs.expect-digest }}
      run: |
        node "$GITHUB_ACTION_PATH/../assert-case.mjs" restore \
          "$EXPECTED_HIT" "$ACTUAL_HIT" "$ACTUAL_KEY" "$EXPECTED_KEY" "$FIXTURE_DIR" "$EXPECT_DIGEST"
